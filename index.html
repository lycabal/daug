<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#050505" />
<title>IPOPHL Deadlines</title>
<style>
:root {
  --bg: #050505;
  --bg2: #0a0a0a;
  --bg3: #111111;
  --surface: #0e0e0e;
  --line: #1a1a1a;
  --line2: #252525;
  --text: #f2f2f2;
  --muted: #8a8a8a;
  --muted2: #5c5c5c;
  --accent: #e8e8e8;
  --accent-dim: rgba(232,232,232,.08);
  --danger: #ff6b6b;
  --warn: #d4a017;
  --ok: #6bcf7f;
  --chip: #161616;
  --radius: 12px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; padding: calc(12px + var(--safe-t)) 14px calc(24px + var(--safe-b)); max-width: 430px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; }

.app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.app-header h1 { font-size: 1.15rem; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
.app-header .sub { font-size: 0.72rem; color: var(--muted2); letter-spacing: 0.04em; text-transform: uppercase; }
.badge-prov { display: inline-flex; align-items: center; gap: 6px; font-size: 0.68rem; color: var(--warn); border: 1px solid rgba(212,160,23,.25); background: rgba(212,160,23,.06); padding: 4px 8px; border-radius: 999px; }

.search { width: 100%; background: var(--bg3); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; margin-bottom: 14px; outline: none; color: var(--text); }
.search:focus { border-color: var(--line2); }
.search::placeholder { color: var(--muted2); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { font-size: 0.72rem; color: var(--muted); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; transition: .15s; }
.chip.on { color: var(--text); border-color: var(--line2); background: var(--accent-dim); }
.chip .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.panel h2 { font-size: 0.72rem; font-weight: 500; color: var(--muted2); letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 12px; }

.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav .month { font-size: 0.95rem; font-weight: 500; letter-spacing: -0.01em; }
.cal-nav button { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); border: 1px solid transparent; }
.cal-nav button:hover { background: var(--bg3); color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 0.62rem; color: var(--muted2); padding: 4px 0 8px; letter-spacing: 0.04em; }
.cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; color: var(--muted); font-size: 0.78rem; }
.cal-day.empty { visibility: hidden; }
.cal-day.in { color: var(--text); }
.cal-day.today { background: var(--accent-dim); }
.cal-day.selected { outline: 1px solid var(--line2); background: #141414; }
.cal-day .dots { display: flex; gap: 2px; height: 4px; }
.cal-day .dots i { width: 3px; height: 3px; border-radius: 50%; opacity: .7; display: block; }

.day-sheet { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.day-sheet .empty-msg { color: var(--muted2); font-size: 0.82rem; }

.list { display: flex; flex-direction: column; gap: 0; }
.row { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: none; }
.row .bar { width: 3px; border-radius: 2px; min-height: 28px; margin-top: 2px; opacity: .85; }
.row .main { min-width: 0; }
.row .mark { font-size: 0.88rem; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px; }
.row .meta span::after { content: "·"; margin-left: 6px; color: var(--muted2); }
.row .meta span:last-child::after { content: none; }
.row .due { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .due.soon { color: var(--warn); }
.row .due.overdue { color: var(--danger); }
.pill { font-size: 0.62rem; padding: 2px 6px; border-radius: 4px; background: var(--bg3); color: var(--muted); border: 1px solid var(--line); }

.tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--bg3); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.tab { flex: 1; text-align: center; padding: 8px; font-size: 0.75rem; color: var(--muted); border-radius: 8px; }
.tab.on { background: var(--bg); color: var(--text); }

.footer { margin-top: 20px; font-size: 0.65rem; color: var(--muted2); line-height: 1.5; text-align: center; }
.statline { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
.statline span { color: var(--muted); }

.hidden { display: none !important; }

.row { align-items: center; gap: 10px; }
.row.next { background: var(--accent-dim); border-radius: 10px; margin: 0 -6px; padding: 10px 6px; }
.tick {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 999px;
  border: 1px solid var(--line2); color: var(--text);
  display: grid; place-items: center; font-size: 16px; line-height: 1;
}
.tick:active { background: var(--accent-dim); }
.tick[aria-pressed="true"] { background: var(--ok); border-color: transparent; color: #050505; }
.row .main { flex: 1; min-width: 0; }
.next-banner {
  font-size: 13px; color: var(--muted); letter-spacing: 0.01em; text-transform: none;
  margin: 0 0 10px;
}
.done-hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.undo {
  font-size: 12px; color: var(--muted); text-decoration: underline; padding: 8px 0;
}


.row { display: flex; align-items: center; gap: 10px; }
.row .main { flex: 1; min-width: 0; }
.row .mark {
  font-size: 15px; font-weight: 500; line-height: 1.3;
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  word-break: break-word;
  max-width: 100%;
}
.row .due { flex: 0 0 7.2rem; max-width: 7.2rem; text-align: right; font-size: 11px; line-height: 1.25; color: var(--muted); white-space: normal; }
.tick {
  flex: 0 0 44px; width: 44px; height: 44px; min-width: 44px; min-height: 44px;
  border-radius: 999px; border: 1px solid var(--line2); color: var(--text);
  display: grid; place-items: center; font-size: 18px; line-height: 1; order: 5;
}
.row .bar { order: 0; }
.row .main { order: 1; }
.row .due { order: 2; }
.row .tick { order: 3; }
.row.next .bar.urgency-overdue { background: var(--danger) !important; }
.row.next .bar.urgency-soon { background: var(--warn) !important; }
.section-label {
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin: 16px 0 8px;
}
.section-label:first-child { margin-top: 0; }
.search-wrap { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.search-wrap .search { flex: 1; margin: 0; }
.search-wrap.collapsed .search { display: none; }
.search-toggle {
  flex: 0 0 44px; height: 44px; width: 44px; border-radius: 10px;
  border: 1px solid var(--line2); color: var(--muted); font-size: 16px;
}

.review-btn {
  flex: 0 0 auto; order: 3; min-height: 44px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--line2);
  color: var(--muted); font-size: 12px; letter-spacing: 0.02em;
}
.review-btn:active { background: var(--accent-dim); color: var(--text); }

.actions {
  flex: 0 0 auto; order: 3; display: flex; gap: 6px; align-items: center;
}
.tick, .drop {
  flex: 0 0 44px; width: 44px; height: 44px; min-width: 44px; min-height: 44px;
  border-radius: 999px; border: 1px solid var(--line2); color: var(--text);
  display: grid; place-items: center; font-size: 16px; line-height: 1;
}
.tick:active { background: rgba(107,207,127,.15); }
.drop { color: var(--muted); }
.drop:active { background: rgba(255,107,107,.12); color: var(--danger); }
.row .dates {
  font-size: 11px; color: var(--muted2); margin-top: 2px; line-height: 1.35;
  white-space: normal;
}
.row .due {
  flex: 0 0 6.5rem; max-width: 6.5rem; text-align: right;
  font-size: 12px; font-weight: 500; line-height: 1.25; color: var(--text);
  white-space: normal; order: 2;
}
.row .due.overdue { color: var(--danger); font-weight: 500; }
.row .due.soon { color: var(--warn); }
.row .meta { font-size: 11px; }


.row .main { flex: 1 1 auto; min-width: 0; max-width: calc(100% - 11.5rem); }
.row .mark {
  font-size: 14px; font-weight: 500; line-height: 1.3;
  white-space: normal;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; word-break: break-word;
}
.row .dates { font-size: 11px; color: var(--muted2); margin-top: 3px; line-height: 1.35; }
.row .dates div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .due { flex: 0 0 5.8rem; max-width: 5.8rem; font-size: 11px; }
.actions { order: 3; display: flex; gap: 6px; align-items: center; }
.actions .drop { order: 1; border-color: var(--line2); color: var(--muted2); background: transparent; opacity: 0.85; }
.actions .tick { order: 2; border-color: var(--line2); color: var(--text); background: var(--chip); }


.row { display: flex; align-items: flex-start; gap: 10px; }
.row .main { flex: 1 1 auto; min-width: 0; max-width: none; }
.row .right-rail {
  flex: 0 0 auto; order: 2; display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px; max-width: 7.5rem;
}
.row .right-rail .due {
  flex: none; max-width: none; width: auto; min-width: 0;
  text-align: right; font-size: 11px; line-height: 1.25; order: 0;
  white-space: normal;
}
.row .right-rail .actions { order: 1; }

.backup-bar {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin: 14px 0 8px;
}
.backup-bar button, .backup-bar label {
  min-height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line2); color: var(--muted); font-size: 12px;
  display: inline-flex; align-items: center; cursor: pointer; background: transparent;
}
.backup-bar button:active, .backup-bar label:active { background: var(--accent-dim); color: var(--text); }
.backup-bar input[type=file] { display: none; }
.backup-status { font-size: 11px; color: var(--muted2); text-align: center; min-height: 1em; }
</style>
</head>
<body>
<header class="app-header">
  <div>
    <h1>Deadlines</h1>
    <div class="sub">IPOPHL · COR-verified</div>
  </div>
  <div class="badge-prov" title="All dates provisional until you confirm">Provisional</div>
</header>

<div class="search-wrap collapsed" id="searchWrap">
  <button type="button" class="search-toggle" id="searchToggle" aria-label="Search marks or application numbers" aria-expanded="false" title="Search">⌕</button>
  <input class="search" id="q" type="search" placeholder="Search mark or app no." autocomplete="off" />
</div>

<div class="filters" id="filters"></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-view="up">Upcoming</button>
  <button class="tab" data-view="cal">Calendar</button>
  <button class="tab" data-view="done">Done</button>
</nav>

<section class="panel" id="view-up">
  <div class="next-banner" id="nextBanner">Next up</div>
  <div class="list" id="upcoming"></div>
</section>

<section class="panel hidden" id="view-cal">
  <div class="cal-nav">
    <button id="prev" aria-label="Previous month">‹</button>
    <div class="month" id="monthLabel"></div>
    <button id="next" aria-label="Next month">›</button>
  </div>
  <div class="cal-grid" id="cal"></div>
  <div class="day-sheet" id="daySheet">
    <div class="empty-msg">Tap a day</div>
  </div>
</section>

<section class="panel hidden" id="view-done">
  <p class="done-hint">Submitted filings. Undo puts one back in the open queue.</p>
  <div class="list" id="doneList"></div>
  <div class="section-label">Not maintaining</div>
  <p class="done-hint">Dropped with ✕ — no longer asked to maintain. Undo restores.</p>
  <div class="list" id="droppedList"></div>
</section>

<div class="backup-bar">
  <button type="button" id="btnExport" aria-label="Export checks and drops">Export backup</button>
  <label for="importFile">Import backup<input id="importFile" type="file" accept="application/json,.json" /></label>
</div>
<p class="backup-status" id="backupStatus"></p>
<footer class="footer">
  <div class="statline" id="stats"></div>
  Offline · anniversary-inclusive · COR-only dates · Asia/Manila
</footer>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
  const KIND = DATA.meta.kind_meta || {};
  const ALL_KINDS = Object.keys(KIND);
  let activeKinds = new Set(ALL_KINDS);
  let query = '';
  let view = 'up';
  const today = new Date(DATA.meta.as_of + 'T12:00:00');
  let cursor = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = DATA.meta.as_of;

  const DONE_KEY = 'ipophil-deadlines-done-v1';
  const DROP_KEY = 'ipophil-deadlines-dropped-v1';
  function loadSet(key){
    try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
    catch { return new Set(); }
  }
  function saveSet(key, set){ localStorage.setItem(key, JSON.stringify([...set])); }
  let doneIds = loadSet(DONE_KEY);
  let droppedIds = loadSet(DROP_KEY);
  function eventId(e){ return [e.app_or_reg_no||'', e.kind||'', e.due_date||''].join('|'); }
  function markKey(e){ return (e.app_or_reg_no||'').trim(); }

  // Filing sequence: never surface a later step until earlier ones are ✓ submitted
  const KIND_ORDER = ['dau_3rd','dau_5th','registration_renewal','renewal_dau','mid_renewal_dau'];
  function kindRank(k){
    const i = KIND_ORDER.indexOf(k);
    return i < 0 ? 999 : i;
  }
  function nextOpenByMark(events){
    // group by mark; keep only the earliest incomplete kind in sequence
    const by = new Map();
    for(const e of events){
      const mk = markKey(e);
      if(!mk) continue;
      if(!by.has(mk)) by.set(mk, []);
      by.get(mk).push(e);
    }
    const out = [];
    for(const [, list] of by){
      list.sort((a,b)=> kindRank(a.kind) - kindRank(b.kind) || (a.due_date||'').localeCompare(b.due_date||''));
      const next = list.find(e => !isDone(e));
      if(next) out.push(next);
    }
    return out;
  }


  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => [...el.querySelectorAll(s)];

  function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
  function fmt(s){
    if(!s) return '—';
    return parseYMD(s).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'});
  }
  function fmtShort(s){
    if(!s) return '—';
    const d=parseYMD(s);
    const mon=d.toLocaleDateString('en-PH',{month:'short'});
    return `${mon} ${d.getDate()}, ${String(d.getFullYear()).slice(2)}`;
  }
  function daysUntil(s){
    const a=parseYMD(s), b=new Date(today);
    b.setHours(12,0,0,0); a.setHours(12,0,0,0);
    return Math.round((a-b)/86400000);
  }
  function dueClass(s){
    const n=daysUntil(s);
    if(n<0) return 'overdue';
    if(n<=60) return 'soon';
    return '';
  }
  function dueLabel(s){
    const n=daysUntil(s);
    if(n<0){
      const abs = Math.abs(n);
      let plain;
      if(abs >= 365){ const y=Math.round(abs/365); plain=`~${y} year${y===1?'':'s'} overdue`; }
      else if(abs >= 30){ const mo=Math.round(abs/30); plain=`~${mo} month${mo===1?'':'s'} overdue`; }
      else { plain=`${abs} day${abs===1?'':'s'} overdue`; }
      return `${fmtShort(s)} · ${plain}`;
    }
    if(n===0) return `${fmtShort(s)} · today`;
    if(n===1) return `${fmtShort(s)} · tomorrow`;
    if(n<=60) return `${fmtShort(s)} · in ${n}d`;
    return fmt(s);
  }

  function isDropped(e){ return droppedIds.has(markKey(e)) || droppedIds.has(eventId(e)); }
  function isDone(e){ return doneIds.has(eventId(e)); }

  function filteredEvents({includeDone=false, includeDropped=false, sequenceGate=true}={}){
    const q=query.trim().toLowerCase();
    let list = DATA.events.filter(e=>{
      if(!includeDone && isDone(e)) return false;
      if(!includeDropped && isDropped(e)) return false;
      if(!activeKinds.has(e.kind)) return false;
      if(!q) return true;
      return (e.mark_or_title||'').toLowerCase().includes(q) || (e.app_or_reg_no||'').toLowerCase().includes(q);
    });
    // One open filing step per mark: 3rd DAU before 5th before renewal, etc.
    if(sequenceGate && !includeDone){
      list = nextOpenByMark(list);
    }
    return list.sort((a,b)=>{
      if(a.due_date!==b.due_date) return (a.due_date||'').localeCompare(b.due_date||'');
      return (a.mark_or_title||'').localeCompare(b.mark_or_title||'');
    });
  }

  function splitOpen(evs){
    const overdue=[], action=[];
    for(const e of evs){
      if(daysUntil(e.due_date) < 0) overdue.push(e);
      else action.push(e);
    }
    return {overdue, action};
  }

  function markDone(id){
    doneIds.add(id);
    // if was dropped, remove from dropped
    droppedIds.delete(id);
    saveSet(DONE_KEY, doneIds);
    saveSet(DROP_KEY, droppedIds);
    render();
  }
  function markDropped(eOrId){
    // drop whole mark (all deadlines for app) to not-maintaining
    const key = typeof eOrId === 'string' && eOrId.includes('|') ? eOrId.split('|')[0] : (eOrId.app_or_reg_no || eOrId);
    const mk = String(key).trim();
    droppedIds.add(mk);
    // remove done flags for this mark's events so they live in dropped
    for(const e of DATA.events){
      if(markKey(e)===mk) doneIds.delete(eventId(e));
    }
    saveSet(DROP_KEY, droppedIds);
    saveSet(DONE_KEY, doneIds);
    render();
  }
  function undoDone(id){ doneIds.delete(id); saveSet(DONE_KEY, doneIds); render(); }
  function undoDropped(mk){ droppedIds.delete(mk); saveSet(DROP_KEY, droppedIds); render(); }

  function renderFilters(){
    const el=$('#filters');
    el.innerHTML = ALL_KINDS.map(k=>{
      const m=KIND[k];
      const on=activeKinds.has(k)?'on':'';
      return `<button class="chip ${on}" data-kind="${k}"><i class="dot" style="background:${m.color}"></i>${m.short||m.label}</button>`;
    }).join('') + `<button class="chip ${activeKinds.size===ALL_KINDS.length?'on':''}" data-kind="*">All</button>`;
    $$('.chip', el).forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.kind;
      if(k==='*'){ activeKinds=new Set(ALL_KINDS); }
      else {
        if(activeKinds.has(k) && activeKinds.size>1) activeKinds.delete(k);
        else activeKinds.add(k);
      }
      render();
    }));
  }

  function renderCal(){
    const y=cursor.getFullYear(), m=cursor.getMonth();
    $('#monthLabel').textContent = cursor.toLocaleDateString('en-PH',{month:'long',year:'numeric'});
    const first=new Date(y,m,1);
    const startDow=(first.getDay()+6)%7;
    const dim=new Date(y,m+1,0).getDate();
    const byDay={};
    filteredEvents().forEach(e=>{
      const d=e.due_date;
      if(!d || !d.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)) return;
      (byDay[d]=byDay[d]||[]).push(e);
    });
    let html='';
    ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d=> html+=`<div class="cal-dow">${d}</div>`);
    for(let i=0;i<startDow;i++) html+=`<div class="cal-day empty"></div>`;
    for(let day=1;day<=dim;day++){
      const id=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const evs=byDay[id]||[];
      const kinds=[...new Set(evs.map(e=>e.kind))].slice(0,3);
      const cls=['cal-day','in'];
      if(id===DATA.meta.as_of) cls.push('today');
      if(id===selected) cls.push('selected');
      const dots=kinds.map(k=>`<i style="background:${KIND[k].color}"></i>`).join('');
      html+=`<button class="${cls.join(' ')}" data-day="${id}"><span>${day}</span><span class="dots">${dots}</span></button>`;
    }
    $('#cal').innerHTML=html;
    $$('.cal-day.in', $('#cal')).forEach(b=>b.addEventListener('click',()=>{ selected=b.dataset.day; renderCal(); renderDay(); }));
    renderDay();
  }

  function renderDay(){
    const sheet=$('#daySheet');
    const evs=filteredEvents().filter(e=>e.due_date===selected);
    if(!evs.length){
      sheet.innerHTML=`<div class="empty-msg">${fmt(selected)} · no open deadlines</div>`;
      return;
    }
    sheet.innerHTML=`<h2 style="margin-top:0">${fmt(selected)}</h2>`+renderRows(evs, {actions:true, highlightFirst:false});
    bindRowActions(sheet);
  }

  function urgencyClass(e){
    const n=daysUntil(e.due_date);
    if(n<0) return 'urgency-overdue';
    if(n<=60) return 'urgency-soon';
    return '';
  }

  function renderRows(evs, {actions=true, undoDoneBtn=false, undoDropBtn=false, highlightFirst=false}={}){
    return `<div class="list">${evs.map((e,i)=>{
      const id=eventId(e);
      const mk=markKey(e);
      const isNext = highlightFirst && i===0;
      const barClass = isNext ? urgencyClass(e) : '';
      const barColor = isNext && barClass ? '' : `background:${e.color}`;
      let actionHtml = '';
      if(undoDoneBtn){
        actionHtml = `<button class="undo" data-undo-done="${escape(id)}">Undo</button>`;
      } else if(undoDropBtn){
        actionHtml = `<button class="undo" data-undo-drop="${escape(mk)}">Undo</button>`;
      } else if(actions){
        actionHtml = `<div class="actions">
          <button class="drop" data-drop="${escape(mk)}" aria-label="Stop maintaining this mark" title="Not maintaining">✕</button>
          <button class="tick" data-done="${escape(id)}" aria-label="Mark as submitted" title="Submitted">✓</button>
        </div>`;
      }
      const filing = e.filing_date_cor ? `Filed ${fmtShort(e.filing_date_cor)}` : 'Filed —';
      const reg = e.registration_date_cor ? `Reg. ${fmtShort(e.registration_date_cor)}` : 'Reg. —';
      return `
      <div class="row ${isNext?'next':''}">
        <div class="bar ${barClass}" style="${barColor}"></div>
        <div class="main">
          <div class="mark">${escape(e.mark_or_title||'—')}</div>
          <div class="dates"><div>${escape(filing)}</div><div>${escape(reg)}</div></div>
          <div class="meta">
            <span>${escape(e.kind_short||e.kind_label)}</span>
            <span>${escape(e.app_or_reg_no||'')}</span>
            ${isNext?'<span class="pill">next</span>':''}
          </div>
        </div>
        <div class="right-rail">
          <div class="due ${dueClass(e.due_date)}">${dueLabel(e.due_date)}</div>
          ${actionHtml}
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function bindRowActions(root){
    $$('[data-done]', root).forEach(b=>b.addEventListener('click',()=> markDone(b.dataset.done)));
    $$('[data-drop]', root).forEach(b=>b.addEventListener('click',()=> markDropped(b.dataset.drop)));
    $$('[data-undo-done]', root).forEach(b=>b.addEventListener('click',()=> undoDone(b.dataset.undoDone)));
    $$('[data-undo-drop]', root).forEach(b=>b.addEventListener('click',()=> undoDropped(b.dataset.undoDrop)));
  }

  function droppedMarksSummary(){
    // one row per dropped mark: soonest remaining deadline as representative
    const by={};
    for(const e of DATA.events){
      const mk=markKey(e);
      if(!droppedIds.has(mk)) continue;
      if(!activeKinds.has(e.kind)) continue;
      const q=query.trim().toLowerCase();
      if(q && !(e.mark_or_title||'').toLowerCase().includes(q) && !(e.app_or_reg_no||'').toLowerCase().includes(q)) continue;
      if(!by[mk] || (e.due_date||'') < (by[mk].due_date||'')) by[mk]=e;
    }
    return Object.values(by).sort((a,b)=>(a.mark_or_title||'').localeCompare(b.mark_or_title||''));
  }

  function renderUpcoming(){
    // Sequence-gated: one step per mark. Sort by due date so overdue 3rd-year DAUs lead.
    const all=filteredEvents();
    const banner=$('#nextBanner');
    let html='';

    if(all.length){
      const n=daysUntil(all[0].due_date);
      if(n<0) banner.textContent = 'Action queue · overdue first';
      else if(n===0) banner.textContent = 'Action queue · due today';
      else if(n<=60) banner.textContent = `Action queue · in ${n} day${n===1?'':'s'}`;
      else banner.textContent = 'Action queue';
      html += `<p class="done-hint">Each mark shows only its next unfiled step: 3rd-year DAU → 5th-year DAU → registration renewal → renewal DAU → mid-renewal DAU. ✓ advances to the next. ✓ = submitted.</p>`;
      html += renderRows(all.slice(0,120), {actions:true, highlightFirst:true});
    } else {
      banner.textContent = 'All clear';
    }

    const dropped = droppedMarksSummary();
    if(dropped.length){
      html += `<div class="section-label">Not maintaining</div>`;
      html += renderRows(dropped, {actions:false, undoDropBtn:true});
    }

    if(!all.length && !dropped.length){
      html = `<div class="empty-msg">No open deadlines — nice.</div>`;
    }

    $('#upcoming').innerHTML = html;
    bindRowActions($('#upcoming'));
  }

  function renderDone(){
    const q=query.trim().toLowerCase();
    const items = DATA.events.filter(e=>{
      if(!isDone(e)) return false;
      if(isDropped(e)) return false;
      if(!activeKinds.has(e.kind)) return false;
      if(!q) return true;
      return (e.mark_or_title||'').toLowerCase().includes(q) || (e.app_or_reg_no||'').toLowerCase().includes(q);
    }).sort((a,b)=>(b.due_date||'').localeCompare(a.due_date||''));
    $('#doneList').innerHTML = items.length
      ? renderRows(items, {actions:false, undoDoneBtn:true})
      : `<div class="empty-msg">Nothing submitted yet</div>`;
    bindRowActions($('#doneList'));

    const dropped = droppedMarksSummary();
    const dl = $('#droppedList');
    if(dl){
      dl.innerHTML = dropped.length
        ? renderRows(dropped, {actions:false, undoDropBtn:true})
        : `<div class="empty-msg">No dropped marks</div>`;
      bindRowActions(dl);
    }
  }

  function escape(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


  function buildBackup(){
    return {
      version: 1,
      exported_at: new Date().toISOString(),
      timezone: 'Asia/Manila',
      done: [...doneIds],
      dropped: [...droppedIds],
      keys: { done: DONE_KEY, dropped: DROP_KEY }
    };
  }
  function applyBackup(obj){
    if(!obj || !Array.isArray(obj.done) || !Array.isArray(obj.dropped)){
      throw new Error('Invalid backup file');
    }
    doneIds = new Set(obj.done.map(String));
    droppedIds = new Set(obj.dropped.map(String));
    saveSet(DONE_KEY, doneIds);
    saveSet(DROP_KEY, droppedIds);
    render();
  }
  function setBackupStatus(msg){
    const el = $('#backupStatus');
    if(el) el.textContent = msg || '';
  }
  function exportBackup(){
    const data = buildBackup();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    const day = (DATA.meta && DATA.meta.as_of) || new Date().toISOString().slice(0,10);
    a.href = URL.createObjectURL(blob);
    a.download = `ipophil-dashboard-state-${day}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    setBackupStatus(`Exported ${data.done.length} done · ${data.dropped.length} dropped — send this file to IP Dashboard once so Monday backups can version it.`);
  }
  function importBackupFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        applyBackup(JSON.parse(reader.result));
        setBackupStatus(`Imported backup from ${file.name}`);
      } catch (err) {
        setBackupStatus('Import failed — use an Export backup JSON.');
      }
    };
    reader.readAsText(file);
  }

  function renderStats(){
    const {overdue, action}=splitOpen(filteredEvents());
    $('#stats').innerHTML=`
      <span>${action.length} due/upcoming</span>
      <span>${overdue.length} overdue</span>
      <span>${doneIds.size} done</span>
      <span>${droppedIds.size} dropped</span>`;
  }

  function render(){
    renderFilters();
    $('#view-cal').classList.toggle('hidden', view!=='cal');
    $('#view-up').classList.toggle('hidden', view!=='up');
    $('#view-done').classList.toggle('hidden', view!=='done');
    $$('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.view===view));
    if(view==='cal') renderCal();
    if(view==='up') renderUpcoming();
    if(view==='done') renderDone();
    renderStats();
  }

  $('#prev').onclick=()=>{ cursor=new Date(cursor.getFullYear(), cursor.getMonth()-1, 1); renderCal(); };
  $('#next').onclick=()=>{ cursor=new Date(cursor.getFullYear(), cursor.getMonth()+1, 1); renderCal(); };
  $('#q').addEventListener('input', e=>{ query=e.target.value; render(); });
  $$('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{ view=t.dataset.view; render(); }));
  const wrap=$('#searchWrap'), tog=$('#searchToggle');
  if(tog && wrap){
    tog.addEventListener('click',()=>{
      const open=!wrap.classList.contains('collapsed');
      wrap.classList.toggle('collapsed', open);
      tog.setAttribute('aria-expanded', String(!open));
      tog.setAttribute('aria-label', open ? 'Search marks or application numbers' : 'Hide search');
      if(!open) $('#q').focus();
    });
  }


  const btnEx = $('#btnExport');
  if(btnEx) btnEx.addEventListener('click', exportBackup);
  const imp = $('#importFile');
  if(imp) imp.addEventListener('change', () => {
    const f = imp.files && imp.files[0];
    if(f) importBackupFile(f);
    imp.value = '';
  });

  render();
})();
</script>
</body>
</html>
