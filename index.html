<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0f1419" />
<title>IPOPHL Deadlines</title>
<style>
:root {
  --bg: #0f1419;
  --bg2: #161c24;
  --bg3: #1c2430;
  --surface: #1a222d;
  --border: #2a3544;
  --border2: #3a4658;
  --text: #e8eef6;
  --muted: #8b9bb0;
  --muted2: #6b7a8f;
  --accent: #5b9fd4;
  --danger: #f07178;
  --warn: #e6b450;
  --ok: #7fd962;
  --chip: #243041;
  --shadow: 0 8px 32px rgba(0,0,0,.45);
  --radius: 14px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6f9;
    --bg2: #ffffff;
    --bg3: #eef2f7;
    --surface: #ffffff;
    --border: #d5dde8;
    --border2: #b8c4d4;
    --text: #15202b;
    --muted: #5a6b80;
    --muted2: #7a8a9e;
    --accent: #1a6fb5;
    --chip: #e8eef6;
    --shadow: 0 8px 28px rgba(20,40,70,.12);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding:
    calc(12px + var(--safe-t))
    calc(14px + var(--safe-r))
    calc(28px + var(--safe-b))
    calc(14px + var(--safe-l));
  max-width: 720px;
  margin: 0 auto;
}
button, input { font: inherit; color: inherit; }
button {
  background: var(--chip);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  min-height: 44px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:active { opacity: .85; }
button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
h1,h2,h3 { margin: 0; font-weight: 650; letter-spacing: -0.02em; }
.header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
.header h1 { font-size: 1.45rem; }
.header .sub {
  color: var(--muted); font-size: .9rem;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .7rem; font-weight: 600; letter-spacing: .02em;
  text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(230,180,80,.15);
  color: var(--warn);
  border: 1px solid rgba(230,180,80,.35);
}
.chips {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
@media (min-width: 520px) {
  .chips { grid-template-columns: repeat(4, 1fr); }
}
.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  min-height: 72px;
}
.chip .n {
  font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
}
.chip .l { color: var(--muted); font-size: .78rem; margin-top: 4px; }
.chip.warn .n { color: var(--warn); }
.chip.alert .n { color: var(--danger); }
.chip.ok .n { color: var(--ok); }
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  min-height: 48px;
  outline: none;
}
.search:focus { border-color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button {
  padding: 8px 11px;
  min-height: 40px;
  font-size: .78rem;
  border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 10px;
}
.cal-head h2 { font-size: 1.05rem; flex: 1; text-align: center; }
.nav-btn {
  width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center;
  font-size: 1.2rem;
  border-radius: 12px;
}
.weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px; margin-bottom: 4px;
}
.weekdays span {
  text-align: center; font-size: .68rem; color: var(--muted2);
  font-weight: 600; padding: 4px 0; text-transform: uppercase;
}
.grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  touch-action: pan-y;
}
.day {
  aspect-ratio: 1;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 3px;
  min-height: 48px;
}
.day .num { font-size: .85rem; font-weight: 550; line-height: 1.2; }
.day.muted { color: var(--muted2); opacity: .45; }
.day.today { border-color: var(--accent); background: rgba(91,159,212,.12); }
.day.has { background: var(--bg3); }
.day.selected { outline: 2px solid var(--accent); }
.pills { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; max-width: 100%; }
.pill { width: 6px; height: 6px; border-radius: 50%; }
.day-count { font-size: .55rem; color: var(--muted); font-weight: 700; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; margin: 4px 0 10px;
}
.section-title h2 { font-size: 1.05rem; }
.section-title .hint { color: var(--muted); font-size: .78rem; }
.list { display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 4px 1fr;
  gap: 12px;
  align-items: start;
  min-height: 64px;
}
.card .bar { width: 4px; border-radius: 4px; align-self: stretch; min-height: 40px; }
.card .body { min-width: 0; }
.card .top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px;
}
.kind-tag {
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em; padding: 2px 7px; border-radius: 6px;
  background: var(--chip); border: 1px solid var(--border);
}
.mark { font-weight: 650; font-size: .98rem; word-break: break-word; }
.meta-row {
  color: var(--muted); font-size: .8rem;
  display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px;
}
.meta-row code {
  font-family: var(--mono); font-size: .76rem;
  color: var(--text); opacity: .85;
}
.due { font-weight: 650; font-variant-numeric: tabular-nums; }
.due.overdue { color: var(--danger); }
.due.soon { color: var(--warn); }
.empty {
  text-align: center; color: var(--muted);
  padding: 28px 16px; font-size: .92rem;
  border: 1px dashed var(--border); border-radius: 12px;
}
.empty strong { color: var(--text); display: block; margin-bottom: 6px; }
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
  z-index: 40;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: min(72dvh, 560px);
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  z-index: 50;
  transform: translateY(110%);
  transition: transform .25s ease;
  padding: 10px 14px calc(18px + var(--safe-b));
  display: flex; flex-direction: column;
  max-width: 720px; margin: 0 auto;
  box-shadow: var(--shadow);
}
.sheet.open { transform: translateY(0); }
.sheet .handle {
  width: 40px; height: 4px; border-radius: 4px;
  background: var(--border2); margin: 4px auto 12px;
}
.sheet h3 { font-size: 1rem; margin-bottom: 10px; }
.sheet .sheet-list {
  overflow: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 8px;
  padding-bottom: 8px;
}
.legend {
  display: flex; flex-wrap: wrap; gap: 8px 12px;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: .72rem; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.footer-note {
  color: var(--muted2); font-size: .72rem;
  text-align: center; margin-top: 8px; line-height: 1.4;
}
</style>
</head>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
  const KIND_META = DATA.meta.kind_meta;
  const ALL_KINDS = Object.keys(KIND_META);
  const TZ = 'Asia/Manila';

  function manilaToday() {
    try {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const y = parts.find(p => p.type === 'year').value;
      const m = parts.find(p => p.type === 'month').value;
      const d = parts.find(p => p.type === 'day').value;
      return y + '-' + m + '-' + d;
    } catch (e) {
      return DATA.meta.as_of;
    }
  }

  const todayStr = manilaToday();
  const today = parseISO(todayStr);

  const state = {
    year: today.getFullYear(),
    month: today.getMonth(),
    enabledKinds: new Set(ALL_KINDS),
    query: '',
    selectedDay: null,
  };

  function parseISO(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtISO(dt) {
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const d = String(dt.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }
  function addDays(dt, n) {
    return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
  }
  function addMonthsDate(dt, n) {
    return new Date(dt.getFullYear(), dt.getMonth() + n, dt.getDate());
  }
  function fmtLong(iso) {
    return parseISO(iso).toLocaleDateString('en-PH', {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });
  }
  function fmtMonthYear(y, m0) {
    return new Date(y, m0, 1).toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
  }
  function daysBetween(a, b) {
    return Math.round((parseISO(b) - parseISO(a)) / 86400000);
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function filteredEvents() {
    const q = state.query.trim().toLowerCase();
    return DATA.events.filter(e => {
      if (!state.enabledKinds.has(e.kind)) return false;
      if (!q) return true;
      return (e.mark_or_title || '').toLowerCase().includes(q)
        || (e.app_or_reg_no || '').toLowerCase().includes(q);
    });
  }
  function filteredNeedsCor() {
    const q = state.query.trim().toLowerCase();
    if (!q) return DATA.needs_cor;
    return DATA.needs_cor.filter(m =>
      (m.mark_or_title || '').toLowerCase().includes(q)
      || (m.app_or_reg_no || '').toLowerCase().includes(q)
    );
  }

  function summary(events) {
    const endMonth = fmtISO(new Date(today.getFullYear(), today.getMonth() + 1, 0));
    const end90 = fmtISO(addDays(today, 90));
    let dueMonth = 0, due90 = 0;
    for (const e of events) {
      if (e.due_date >= todayStr && e.due_date <= endMonth) dueMonth++;
      if (e.due_date >= todayStr && e.due_date <= end90) due90++;
    }
    return {
      dueMonth,
      due90,
      needsCor: DATA.meta.counts.needs_cor,
      corVerified: DATA.meta.counts.marks_cor_verified,
    };
  }

  function chip(n, label, cls) {
    return '<div class="chip ' + (cls || '') + '"><div class="n">' + n + '</div><div class="l">' + label + '</div></div>';
  }
  function renderChips() {
    const s = summary(filteredEvents());
    document.getElementById('summaryChips').innerHTML = [
      chip(s.dueMonth, 'Due this month', s.dueMonth ? 'warn' : ''),
      chip(s.due90, 'Next 90 days', s.due90 ? 'warn' : ''),
      chip(s.needsCor, 'Needs COR', 'alert'),
      chip(s.corVerified, 'COR-verified', 'ok'),
    ].join('');
  }

  function renderFilters() {
    const el = document.getElementById('kindFilters');
    el.innerHTML = ALL_KINDS.map(k => {
      const meta = KIND_META[k];
      const on = state.enabledKinds.has(k);
      return '<button type="button" data-kind="' + k + '" class="' + (on ? 'active' : '') + '">'
        + '<span class="dot" style="background:' + meta.color + '"></span>'
        + meta.short + '</button>';
    }).join('');
    el.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.getAttribute('data-kind');
        if (state.enabledKinds.has(k)) state.enabledKinds.delete(k);
        else state.enabledKinds.add(k);
        renderAll();
      });
    });
  }

  function renderLegend() {
    document.getElementById('legend').innerHTML = ALL_KINDS.map(k => {
      const meta = KIND_META[k];
      return '<span><i class="dot" style="background:' + meta.color + '"></i>' + meta.label + '</span>';
    }).join('');
  }

  function eventsByDay(events) {
    const map = {};
    for (const e of events) {
      (map[e.due_date] || (map[e.due_date] = [])).push(e);
    }
    return map;
  }

  function dayCell(iso, num, muted, list) {
    const classes = ['day'];
    if (muted) classes.push('muted');
    if (iso === todayStr) classes.push('today');
    if (list.length) classes.push('has');
    if (iso && state.selectedDay === iso) classes.push('selected');
    const seen = new Set();
    const kinds = [];
    for (const e of list) {
      if (!seen.has(e.kind)) { seen.add(e.kind); kinds.push(e); }
    }
    const pills = kinds.slice(0, 4).map(e =>
      '<span class="pill" style="background:' + e.color + '"></span>'
    ).join('');
    const extra = list.length > 4
      ? '<span class="day-count">+' + (list.length - 4) + '</span>'
      : (list.length > 1 && kinds.length <= 1 ? '<span class="day-count">' + list.length + '</span>' : '');
    return '<button type="button" class="' + classes.join(' ') + '"'
      + (iso ? ' data-iso="' + iso + '"' : ' disabled')
      + ' aria-label="' + (iso || '') + (list.length ? (', ' + list.length + ' deadlines') : '') + '">'
      + '<span class="num">' + num + '</span>'
      + '<span class="pills">' + pills + extra + '</span></button>';
  }

  function renderCalendar() {
    document.getElementById('monthLabel').textContent = fmtMonthYear(state.year, state.month);
    const byDay = eventsByDay(filteredEvents());
    const first = new Date(state.year, state.month, 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
    const prevDays = new Date(state.year, state.month, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) {
      cells.push(dayCell(null, prevDays - startPad + i + 1, true, []));
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = fmtISO(new Date(state.year, state.month, d));
      cells.push(dayCell(iso, d, false, byDay[iso] || []));
    }
    const rem = (7 - (cells.length % 7)) % 7;
    for (let i = 1; i <= rem; i++) cells.push(dayCell(null, i, true, []));
    document.getElementById('calGrid').innerHTML = cells.join('');
    document.querySelectorAll('.day[data-iso]').forEach(btn => {
      btn.addEventListener('click', () => {
        const iso = btn.getAttribute('data-iso');
        const list = byDay[iso] || [];
        if (!list.length) return;
        openSheet(iso, list);
      });
    });
  }

  function dueClass(iso) {
    if (iso < todayStr) return 'overdue';
    if (daysBetween(todayStr, iso) <= 90) return 'soon';
    return '';
  }

  function eventCard(e) {
    const cls = dueClass(e.due_date);
    const overdueLabel = e.due_date < todayStr ? ' · overdue' : '';
    return '<article class="card">'
      + '<div class="bar" style="background:' + e.color + '"></div>'
      + '<div class="body">'
      + '<div class="top">'
      + '<span class="kind-tag" style="border-color:' + e.color + '33;color:' + e.color + '">' + e.kind_short + '</span>'
      + '<span class="badge">Provisional</span>'
      + '</div>'
      + '<div class="mark">' + escapeHtml(e.mark_or_title) + '</div>'
      + '<div class="meta-row">'
      + '<span class="due ' + cls + '">' + fmtLong(e.due_date) + overdueLabel + '</span>'
      + '<code>' + escapeHtml(e.app_or_reg_no) + '</code>'
      + '<span>from ' + escapeHtml(e.reckoned_from_label) + '</span>'
      + '</div></div></article>';
  }

  function needsCard(m) {
    return '<article class="card">'
      + '<div class="bar" style="background:var(--danger)"></div>'
      + '<div class="body">'
      + '<div class="top"><span class="kind-tag">Needs COR</span></div>'
      + '<div class="mark">' + escapeHtml(m.mark_or_title) + '</div>'
      + '<div class="meta-row">'
      + '<code>' + escapeHtml(m.app_or_reg_no) + '</code>'
      + '<span>' + escapeHtml(m.reason || '') + '</span>'
      + '</div>'
      + (m.filing_date_stated || m.registration_date_stated
        ? '<div class="meta-row" style="opacity:.75">Stated (non-COR): '
          + (m.filing_date_stated ? 'filing ' + m.filing_date_stated : '')
          + (m.filing_date_stated && m.registration_date_stated ? ' · ' : '')
          + (m.registration_date_stated ? 'reg ' + m.registration_date_stated : '')
          + '</div>'
        : '')
      + '</div></article>';
  }

  function renderUpcoming() {
    const end = fmtISO(addMonthsDate(today, 12));
    const lookback = fmtISO(addMonthsDate(today, -18));
    const upcoming = filteredEvents().filter(e => {
      if (e.due_date >= todayStr && e.due_date <= end) return true;
      if (e.due_date < todayStr && e.due_date >= lookback) return true;
      return false;
    }).sort((a, b) => a.due_date < b.due_date ? -1 : 1);
    const el = document.getElementById('upcomingList');
    if (!upcoming.length) {
      el.innerHTML = '<div class="empty"><strong>No COR-verified deadlines in range</strong>Calendar stays sparse until more Certificates of Registration are on file. Check Needs COR below.</div>';
      return;
    }
    el.innerHTML = upcoming.map(eventCard).join('');
  }

  function renderNeedsCor() {
    const list = filteredNeedsCor();
    document.getElementById('needsCorHint').textContent = list.length + ' mark' + (list.length === 1 ? '' : 's');
    const el = document.getElementById('needsCorList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><strong>All marks have COR coverage</strong>No outstanding COR gaps for the current filter.</div>';
      return;
    }
    el.innerHTML = list.map(needsCard).join('');
  }

  function openSheet(iso, list) {
    state.selectedDay = iso;
    document.getElementById('sheetTitle').textContent = fmtLong(iso) + ' · ' + list.length + ' deadline' + (list.length === 1 ? '' : 's');
    document.getElementById('sheetList').innerHTML = list.map(eventCard).join('');
    document.getElementById('daySheet').classList.add('open');
    document.getElementById('sheetBackdrop').classList.add('open');
    renderCalendar();
  }
  function closeSheet() {
    state.selectedDay = null;
    document.getElementById('daySheet').classList.remove('open');
    document.getElementById('sheetBackdrop').classList.remove('open');
    renderCalendar();
  }

  function renderAll() {
    renderChips();
    renderFilters();
    renderCalendar();
    renderUpcoming();
    renderNeedsCor();
  }

  document.getElementById('todayLabel').textContent = fmtLong(todayStr) + ' · Asia/Manila';
  document.getElementById('prevMonth').addEventListener('click', () => {
    state.month -= 1;
    if (state.month < 0) { state.month = 11; state.year -= 1; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    state.month += 1;
    if (state.month > 11) { state.month = 0; state.year += 1; }
    renderCalendar();
  });

  (function () {
    const grid = document.getElementById('calGrid');
    let x0 = null;
    grid.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
    grid.addEventListener('touchend', e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0;
      x0 = null;
      if (Math.abs(dx) < 50) return;
      if (dx < 0) document.getElementById('nextMonth').click();
      else document.getElementById('prevMonth').click();
    }, { passive: true });
  })();

  document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
  document.getElementById('search').addEventListener('input', e => {
    state.query = e.target.value;
    renderAll();
  });

  renderLegend();
  renderAll();
})();
</script>
</body>
</html>
